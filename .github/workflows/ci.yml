# Checks on every push to main and every pull request: formatting, clippy (warnings are errors),
# the tests, and the headless screenshot suite as a smoke test, on Linux and on real Windows.
# See docs/CI.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.99.1

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config fonts-noto-core fonts-dejavu-core fonts-noto-color-emoji \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace --no-fail-fast
      - name: Screenshot suite (smoke test)
        if: ${{ !cancelled() }}
        run: |
          cargo build --release -p mdview -p mdview-engine
          bash tests/shots.sh target/shots
          bash tests/shots-check.sh target/shots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shots-linux
          path: target/shots/*.png
          if-no-files-found: warn
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace --no-fail-fast
      - name: Screenshot suite (smoke test)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo build --release -p mdview -p mdview-engine
          bash tests/shots.sh target/shots
          bash tests/shots-check.sh target/shots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shots-windows
          path: target/shots/*.png
          if-no-files-found: warn
          retention-days: 14
