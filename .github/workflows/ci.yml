# Checks on every push to main and every pull request: formatting, clippy (warnings are errors),
# the tests, and the headless screenshot suite as a smoke test, on Linux and on real Windows.
# See docs/CI.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.99.1

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config fonts-noto-core fonts-dejavu-core fonts-noto-color-emoji \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      # Two tests are not fit for a shared runner (docs/CI.md, "Findings from Linux"): the render test
      # that finds an image's columns by pixel colour depends on the UI font (the runner has Noto
      # Sans, the development machines Segoe UI), so it is skipped here; the timing test of the
      # parser runs alone below, because next to the other tests of its binary on four cores its
      # ratio test is noise.
      - run: >
          cargo test --release --workspace --no-fail-fast --
          --skip an_aligned_image_stands_beside_its_text
          --skip pathological_inputs_stay_linear
      - run: cargo test --release -p mdview-core --test fuzz -- pathological_inputs_stay_linear --test-threads=1
      - name: Screenshot suite (smoke test)
        if: ${{ !cancelled() }}
        run: |
          cargo build --release -p mdview -p mdview-engine
          bash tests/shots.sh target/shots
          bash tests/shots-check.sh target/shots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shots-linux
          path: target/shots/*.png
          if-no-files-found: warn
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      # The parser's timing test runs alone (see the Linux job); --no-fail-fast lists every failing
      # test, not only the first binary's.
      - run: cargo test --release --workspace --no-fail-fast -- --skip pathological_inputs_stay_linear
      - run: cargo test --release -p mdview-core --test fuzz -- pathological_inputs_stay_linear --test-threads=1
      - name: Screenshot suite (smoke test)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo build --release -p mdview -p mdview-engine
          bash tests/shots.sh target/shots
          bash tests/shots-check.sh target/shots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shots-windows
          path: target/shots/*.png
          if-no-files-found: warn
          retention-days: 14
