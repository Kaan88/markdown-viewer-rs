# Pictures of mdview on a real Mac, for looking at the macOS port without one: the headless
# screenshot suite and the app in a real window (tests/mac-window.sh). The pictures are printed
# into the log as base64 (tests/print-pngs.sh) as well as uploaded, since a cloud session cannot
# download artifacts; tools/mac-look-decode.sh turns the log back into files.
name: mac-look

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-look-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.99.1

jobs:
  look:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-look
          workspaces: |
            . -> target
            editor -> target
      - run: cargo build --release --locked -p mdview -p mdshared-md-engine --bins
      - name: Screenshot suite
        run: bash tests/shots.sh target/shots
      - name: The bundle
        run: bash packaging/macos/make-bundle.sh target/release target/dist
      - uses: actions/checkout@v7
        with:
          repository: Kaan88/markdown-editor-rs
          # mdedit's renderer migration supplies its independently pinned engine recipe.
          ref: 721c8e359dc2b9f3c348eb24cc5e3114e4ece06e
          path: editor
      - name: The editor's bundle, beside the viewer's
        run: |
          (
            cd editor
            cargo build --release --locked -p mdedit -p mdedit-ai
            bash packaging/engine-source.sh target/engine-src
            cargo build --release --locked -p mdshared-md-engine --bin mdview-engine \
              --manifest-path target/engine-src/Cargo.toml --target-dir target/engine
            cp target/engine/release/mdview-engine target/release/
          )
          bash editor/packaging/macos/make-bundle.sh editor/target/release target/dist
          test -x target/dist/mdedit.app/Contents/MacOS/mdview-engine
      - name: Updating itself (a newer bundle from a local HTTPS server)
        if: ${{ !cancelled() }}
        run: bash tests/mac-update.sh target/update target/dist/mdview.app
      - name: Opening files from the system, Command+Q
        run: bash tests/mac-open.sh target/open target/dist/mdview.app
      - name: Edit in mdedit, the two bundles side by side
        if: ${{ !cancelled() }}
        run: bash tests/mac-sister.sh target/sister target/dist/mdview.app
      - name: The app in a real window
        if: ${{ !cancelled() }}
        run: |
          bash tests/mac-window.sh target/window/showcase target/dist/mdview.app --no-session "$PWD/fixtures/showcase.md"
          bash tests/mac-window.sh target/window/empty-dark target/dist/mdview.app --no-session --dark
      - name: Print the pictures
        if: ${{ !cancelled() }}
        run: |
          bash tests/print-pngs.sh \
            target/window/showcase/screen.png target/window/showcase/window.png \
            target/window/empty-dark/window.png target/open/opened.png target/open/app-menu.png target/open/launched.png target/open/launched-screen.png target/sister/screen.png \
            target/shots/showcase-light.png target/shots/everything-dark.png \
            target/shots/emoji-light.png target/shots/menu-main-light.png \
            target/shots/dialog-settings-light.png target/shots/scale-200.png
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mac-look
          path: |
            target/shots/*.png
            target/window/**
            target/dist/**
          retention-days: 14
