[workspace]

[package]
name = "mdview-qt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mdview_qt"
path = "src/lib.rs"

[[bin]]
name = "mdview-qt"
path = "src/main.rs"

[dependencies]
mdview-core = { path = "../../crates/core" }
mdview-render = { path = "../../crates/render" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The Qt shell is its own workspace; mirror the root's offline pins.
[patch.crates-io]
bit-set = { path = "../../vendor/bit-set-0.8.0" }
bit-vec = { path = "../../vendor/bit-vec-0.8.0" }
bincode = { path = "../../vendor/bincode-1.3.3" }
quick-xml = { path = "../../vendor/quick-xml-0.42.0" }
