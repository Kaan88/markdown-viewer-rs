[workspace]

[package]
name = "mdview-qt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mdview_qt"
path = "src/lib.rs"

[[bin]]
name = "mdview-qt"
path = "src/main.rs"

[dependencies]
mdview-core = { path = "../../crates/core" }
mdview-render = { path = "../../crates/render" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }
# Renders the bar icons to PNG, since Qt may be installed without its SVG module.
resvg = { version = "=0.47.0", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
