[package]
name = "mermaid-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
r-merman = ["dep:merman", "dep:harfrust", "dep:ttf-parser"]
r-mmdr = ["dep:mermaid-rs-renderer"]
# Variant: adds the COSE (Cytoscape) mindmap layout; not ELK.
r-merman-cose = ["r-merman", "merman/layout-cytoscape"]

[[bin]]
name = "merman-patched"
path = "src/bin/merman_patched.rs"
required-features = ["r-merman"]

[[bin]]
name = "resvg-only"
path = "src/bin/resvg_only.rs"

[[test]]
name = "merman_patched"
required-features = ["r-merman"]

[[bin]]
name = "merman-bin"
path = "src/bin/merman_bin.rs"
required-features = ["r-merman"]

[[bin]]
name = "mmdr-bin"
path = "src/bin/mmdr_bin.rs"
required-features = ["r-mmdr"]

[dependencies]
resvg = { version = "=0.49.0", default-features = false, features = ["text", "system-fonts"] }
merman = { version = "=0.9.3", optional = true, default-features = false, features = ["svg", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er", "diagram-gantt", "diagram-pie", "diagram-mindmap"] }
# Both already linked through resvg, so measuring with them adds no new crates.
harfrust = { version = "=0.12.0", optional = true }
ttf-parser = { version = "=0.25.1", optional = true }
mermaid-rs-renderer = { version = "=0.3.1", optional = true, default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
