<svg id="merman" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 522.96533203125 450" style="max-width:522.965px" role="graphics-document document" aria-roledescription="pie"><style>#merman{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#f0f0f0;}#merman .edge-animation-slow{stroke-dasharray:9,5;stroke-dashoffset:900;stroke-linecap:round;}#merman .edge-animation-fast{stroke-dasharray:9,5;stroke-dashoffset:900;stroke-linecap:round;}#merman .error-icon{fill:#383838;}#merman .error-text{fill:#f0f0f0;stroke:#f0f0f0;}#merman .edge-thickness-normal{stroke-width:1px;}#merman .edge-thickness-thick{stroke-width:3.5px;}#merman .edge-pattern-solid{stroke-dasharray:0;}#merman .edge-thickness-invisible{stroke-width:0;fill:none;}#merman .edge-pattern-dashed{stroke-dasharray:3;}#merman .edge-pattern-dotted{stroke-dasharray:2;}#merman .marker{fill:#c0c0c0;stroke:#c0c0c0;}#merman .marker.cross{stroke:#c0c0c0;}#merman svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#merman p{margin:0;}#merman .pieCircle{stroke:#8a8a8a;stroke-width:2px;opacity:0.7;}#merman .pieCircle.highlighted{scale:1.05;opacity:1;}#merman .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#merman .pieOuterCircle{stroke:#8a8a8a;stroke-width:2px;fill:none;}#merman .pieTitleText{text-anchor:middle;font-size:25px;fill:#f0f0f0;font-family:"trebuchet ms",verdana,arial,sans-serif;}#merman .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#f0f0f0;font-size:17px;}#merman .legend text{fill:#f0f0f0;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#merman .node .neo-node{stroke:#8a8a8a;}#merman [data-look="neo"].node rect,#merman [data-look="neo"].cluster rect,#merman [data-look="neo"].node polygon{stroke:#8a8a8a;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#merman [data-look="neo"].swimlane.cluster rect{filter:none;}#merman [data-look="neo"].node path{stroke:#8a8a8a;stroke-width:1px;}#merman [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#merman [data-look="neo"].node .neo-line path{stroke:#8a8a8a;filter:none;}#merman [data-look="neo"].node circle{stroke:#8a8a8a;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#merman [data-look="neo"].node circle .state-start{fill:#000000;}#merman [data-look="neo"].icon-shape .icon{fill:#8a8a8a;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#merman [data-look="neo"].icon-shape .icon-neo path{stroke:#8a8a8a;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,108.74027167410755,149.66814395936527L0,0Z" fill="#60a5fa" class="pieCircle"/><path d="M108.74027167410755,149.66814395936527A185,185,0,1,1,0,-185L0,0Z" fill="#34d399" class="pieCircle"/><text transform="translate(131.95909163595255,-42.87610796952396)" class="slice" style="text-anchor:middle">40%</text><text transform="translate(-131.95909163595255,42.87610796952397)" class="slice" style="text-anchor:middle">60%</text></g><text x="0" y="-200" class="pieTitleText"/><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill:rgb(96, 165, 250);stroke:rgb(96, 165, 250)"/><text x="22" y="14">A</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill:rgb(52, 211, 153);stroke:rgb(52, 211, 153)"/><text x="22" y="14">B</text></g></g></svg>
