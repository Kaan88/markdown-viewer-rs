[package]
name = "qt-shell-spike"
version = "0.0.0"
edition = "2021"

[workspace]

[lib]
name = "qt_shell"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "qt-shell"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
