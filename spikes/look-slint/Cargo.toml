[package]
name = "look-slint"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
build = "build.rs"

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "backend-winit-wayland",
  "renderer-software",
  "unstable-winit-030",
] }
png = { version = "0.18", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

