[package]
name = "look-qt"
version = "0.0.0"
edition = "2021"

[workspace]

[[bin]]
name = "look-qt"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
