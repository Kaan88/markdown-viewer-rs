[package]
name = "engine-spike"
version = "0.0.0"
edition = "2021"

[workspace]

[[bin]]
name = "mdview-engine"
path = "src/engine.rs"

[[bin]]
name = "host"
path = "src/host.rs"

[dependencies]
png = "0.18"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["standalone", "embed-fonts"] }
ratex-types = "=0.1.15"
resvg = { version = "=0.49", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
opt-level = "s"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["test-jobs"]
# Sleep, memory bomb, panic and stack overflow jobs. Never shipped.
test-jobs = []
