[package]
name = "shell-soft"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }
mdview-render = { path = "../../crates/render" }
parley = "=0.12.0"
png = "=0.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"
