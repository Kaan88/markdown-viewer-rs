[package]
name = "mdview-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mdshared-app = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "1c3710a1ae2fed59585e37b2d4108c8d2802ac43" }
memchr = "2.8"
pulldown-cmark = { version = "=0.13.6", default-features = false }
