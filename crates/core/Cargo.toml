[package]
name = "mdview-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mdshared-app = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "a6b0c9c35b66596a4c6ad590a8d9404fac6c36de" }
memchr = "2.8"
pulldown-cmark = { version = "=0.13.6", default-features = false }
