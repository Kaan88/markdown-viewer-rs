[package]
name = "mdview-fetch"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Remote image downloads for mdview: WinHTTP on Windows, a disk cache, strict limits."

[dependencies]
mdview-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }
