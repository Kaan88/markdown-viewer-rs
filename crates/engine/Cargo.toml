[package]
name = "mdview-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "mdview_engine"
path = "src/lib.rs"

[[bin]]
name = "mdview-engine"
path = "src/main.rs"

[dependencies]
mdview-engine-proto = { path = "../engine-proto" }
resvg = "=0.47.0"
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
merman = { version = "=0.9.3", default-features = false, features = [
    "svg",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-class",
    "diagram-state",
    "diagram-er",
    "diagram-gantt",
    "diagram-pie",
    "diagram-mindmap",
    "diagram-agentflow",
    "diagram-block",
    "diagram-c4",
    "diagram-cynefin",
    "diagram-event-modeling",
    "diagram-git-graph",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-packet",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-xychart",
    "diagram-zenuml",
] }
