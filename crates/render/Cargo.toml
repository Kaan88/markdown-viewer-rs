[package]
name = "mdview-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mdview-core = { path = "../core" }
mdview-engine-proto = { path = "../engine-proto" }
mdshared-text = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "8298204951a467298192b413599d790b46030727" }
mdshared-highlight = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "8298204951a467298192b413599d790b46030727" }
parley = "=0.12.0"
png = "0.18"
zune-jpeg = "=0.5.15"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-webp = { version = "=0.2.4", default-features = false }
