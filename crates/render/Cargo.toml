[package]
name = "mdview-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mdview-core = { path = "../core" }
mdview-engine-proto = { path = "../engine-proto" }
mdshared-text = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "cb0ffd3c8e030f7b4f5b3fd5c4c46672ef525450" }
mdshared-highlight = { git = "https://github.com/Kaan88/markdown-shared-rs", rev = "cb0ffd3c8e030f7b4f5b3fd5c4c46672ef525450" }
parley = "=0.13.0"
png = "0.18"
zune-jpeg = "=0.5.15"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-webp = { version = "=0.2.4", default-features = false }
