[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/engine", "crates/engine-proto", "bins/mdv-bench", "bins/mdv-app"]
exclude = ["spikes"]

[workspace.package]
version = "0.2.3"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The engine is a separate process that starts on demand; code size matters more than its speed.
[profile.release.package.mdview-engine]
opt-level = "s"

# The Wayland client-drawn window shadow (mdshared-ui's `client-margin`): winit gets a content margin
# and softbuffer honours alpha on Wayland. Both are the stock 0.30.13 / 0.4.8 plus one patch; see
# markdown-shared-rs docs/LINUX.md. Drop these two and the feature to build against stock crates:
# the window then uses KWin's shadow protocol or none.
[patch.crates-io]
winit = { git = "https://github.com/Kaan88/winit", rev = "89ace86e65387b44cec55730e5691e894b451722" }
softbuffer = { git = "https://github.com/Kaan88/softbuffer", rev = "dd18fec9d08e2f466c42d4c2cece62aa0ee1eba9" }
