[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/engine", "crates/engine-proto", "bins/mdv-bench", "bins/mdv-winui"]
exclude = ["spikes", "bins/mdv-qt", "bins/mdv-winui/gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The engine is a separate process that starts on demand; code size matters more than its speed.
[profile.release.package.mdview-engine]
opt-level = "s"
